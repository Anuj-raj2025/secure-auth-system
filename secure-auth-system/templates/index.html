<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Authentication System</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="card">
    <h1>🔐 Secure Auth System</h1>
    <p id="message" class="message hidden" role="alert"></p>

    <!-- ========== Login / Register ========== -->
    <section id="auth-view">
      <div class="tabs">
        <button id="tab-login" class="tab active" type="button">Login</button>
        <button id="tab-register" class="tab" type="button">Register</button>
      </div>

      <form id="login-form" autocomplete="on">
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
      </form>

      <form id="register-form" class="hidden" autocomplete="on">
        <input type="text" name="username" placeholder="Username (3-30 letters/numbers)" required>
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <small>Min 8 characters with uppercase, lowercase, number and special character.</small>
        <button type="submit">Create account</button>
      </form>
    </section>

    <!-- ========== Dashboard (needs login) ========== -->
    <section id="dashboard-view" class="hidden">
      <h2>Welcome, <span id="p-username"></span> 👋</h2>
      <ul class="info">
        <li><b>Email:</b> <span id="p-email"></span></li>
        <li><b>Phone (stored encrypted):</b> <span id="p-phone"></span></li>
        <li><b>Member since:</b> <span id="p-created"></span></li>
      </ul>

      <h3>Update phone</h3>
      <form id="phone-form">
        <input type="text" name="phone" placeholder="+91 98765 43210">
        <button type="submit">Save</button>
      </form>

      <h3>Change password</h3>
      <form id="password-form">
        <input type="password" name="old_password" placeholder="Current password" required>
        <input type="password" name="new_password" placeholder="New password" required>
        <button type="submit">Change password</button>
      </form>

      <h3>Recent login activity</h3>
      <ul id="history" class="history"></ul>

      <div class="row">
        <button id="logout-btn" type="button">Logout</button>
        <button id="logout-all-btn" type="button" class="secondary">Logout all devices</button>
      </div>
    </section>
  </main>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
